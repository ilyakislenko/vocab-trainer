[project]
name = "vocab-api"
version = "0.1.0"
description = "Hexagonal + DDD FastAPI backend for a spaced-repetition vocabulary trainer"
readme = "README.md"
authors = [{ name = "vocab-trainer" }]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.141.1",
    "fsrs>=5,<6",
    "greenlet>=3.5.5",
    "pydantic-settings>=2.15.0",
    "sqlmodel>=0.0.39",
    "uvicorn[standard]>=0.52.1",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "import-linter>=2.13",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's DI pattern requires `Depends(...)` as an argument default; each call
# returns a fresh, side-effect-free dependency marker, so B008's mutable-default
# concern doesn't apply. This is ruff's documented opt-out for that exact case.
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["vocab_api"]

[[tool.mypy.overrides]]
# fsrs ships no py.typed marker / stubs; treat it as untyped at the boundary.
module = "fsrs"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
